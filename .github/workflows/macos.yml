name: macOS

# Aparte de CI: los runners macOS arm64 de GitHub a veces quedan en cola hasta que el job se
# cancela por falta de capacidad, y eso no tiene que poner en rojo la CI de Linux.

on:
  push:
  workflow_dispatch:

jobs:
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Herramientas
        run: brew install fpc
      - name: Compilar
        run: ./build.sh macos
      - name: Ida y vuelta (todos los niveles, 1 y 4 hilos)
        run: bash tests/smoke.sh build/macos/parc
      - name: srep (OSREP, núcleo en C compilado con clang)
        run: |
          build/macos/parc a srep.parc src -msrep:l64:a1+lzma:8mb --no-progress
          build/macos/parc t srep.parc --no-progress | grep -q "All OK"
      - uses: actions/upload-artifact@v5
        with:
          name: parc-macos-arm64
          path: build/macos/parc
